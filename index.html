/*! Mesa · modo celular (compartilhado entre as páginas do site)

 *  Como usar: <script src="/mesa-modo-celular.js"><\/script> dentro do <head> de CADA página.
 *  - A opção fica em localStorage['mesa:modo-celular'] ('1' ligado, '0' desligado). Sem escolha salva, liga sozinho em celular.
 *    O localStorage é compartilhado por todas as páginas do MESMO domínio, então ligar numa página vale nas outras.
 *  - A <html> ganha a classe .modo-celular quando está ligado (use no CSS: html.modo-celular .minha-coisa { ... }).

 *  - API: MesaModoCelular.ativo() / .definir(true|false) / .alternar()
 *  - Para NÃO mostrar o botão numa página: <script src="..." data-botao="nao"><\/script>
 */
(function () {
  if (window.MesaModoCelular) return;

  var KEY = 'mesa:modo-celular', root = document.documentElement, mem = null, btn = null;
  var tag = document.currentScript;
  var semBotao = !!(tag && tag.getAttribute('data-botao') === 'nao');

  /* ---------- CSS ---------- */
  var MENU = '#root .crt>div:has(>aside):has(>nav)';   /* só casa com o layout do MENU, não com as outras páginas */
  var P = 'html.modo-celular ' + MENU;
  var CSS = [
    /* botão */
    '#mesa-toggle{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:10001;display:inline-flex;align-items:center;gap:.6rem;min-height:44px;padding:.6rem 1rem;border:1px solid var(--acc,#00ffcc);border-radius:4px;background:#070707;color:var(--acc,#00ffcc);font:700 .75rem/1 var(--font-body,system-ui,sans-serif);letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 18px var(--acc-soft,transparent);-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,box-shadow .2s}',
    '#mesa-toggle svg{width:18px;height:18px;flex:none}',
    '#mesa-toggle:hover,#mesa-toggle[aria-pressed="true"]{background:var(--acc,#00ffcc);color:#000;box-shadow:0 0 28px var(--acc-glow,transparent)}',
    '#mesa-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}',
    'body.share-mode #mesa-toggle{display:none!important}',

    /* base segura para QUALQUER página (especificidade zero: o CSS da página sempre pode sobrescrever) */
    'html.modo-celular{touch-action:manipulation;-webkit-text-size-adjust:100%}',
    'html.modo-celular :where(input,select,textarea){font-size:max(16px,1em)}',   /* evita o zoom automático do iOS ao focar */

    /* menu */

    'html.modo-celular body:has(' + MENU + '){max-width:30rem;margin-inline:auto;min-height:100dvh;position:relative}',
    '@media (min-width:31rem){html.modo-celular body:has(' + MENU + '){border-inline:1px solid #1a1a1a}}',
    'html.modo-celular #root .crt:has(>div:has(>aside):has(>nav)){min-height:100dvh}',
    P + '{display:flex!important;flex-direction:column;gap:1.75rem!important;min-height:100dvh!important;padding:max(1.5rem,env(safe-area-inset-top)) 1.25rem calc(5.5rem + env(safe-area-inset-bottom))!important}',
    P + ' aside{display:contents}',
    P + ' aside>div:first-child{order:1}',
    P + ' nav{order:2;margin-top:0!important}',
    P + ' aside>div:last-child{order:3}',
    P + ' h1{font-size:5rem!important;margin-top:.75rem!important}',
    '@media (max-width:23.75rem){' + P + ' h1{font-size:4rem!important}}',
    P + ' aside p.cursor-blink{margin-top:1rem!important;font-size:1.25rem!important}',
    P + ' nav a>div{padding-block:1.1rem!important;padding-left:0!important;gap:.9rem!important;min-height:4.75rem}',
    P + ' nav a:active>div>span:first-child{width:100%!important}',
    P + ' nav a>div>span:nth-child(2){font-size:1.5rem!important}',
    P + ' nav a>div>svg:first-of-type{width:1.6rem!important;height:1.6rem!important}',
    P + ' nav a>div>svg:last-of-type{width:1.25rem!important;height:1.25rem!important;opacity:.45!important}',
    P + ' nav a h2{font-size:1.8rem!important;line-height:1!important}',
    P + ' nav a p{font-size:.8125rem!important;line-height:1.35!important}',
    P + ' aside>div:last-child button{flex:1 1 9.5rem;min-height:3.5rem}',
    '@media (prefers-reduced-motion:reduce){html.modo-celular .rise{animation:none!important;opacity:1!important}html.modo-celular .cursor-blink::after{animation:none!important}}'

  var st = document.createElement('style');
  st.id = 'mesa-celular-css';
  st.textContent = CSS;
  (document.head || root).appendChild(st);

  /* ---------- estado ---------- */
  function auto() { try { return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 600); } catch (e) { return false; } }
  function ler() {
    var v = null;
    try { v = localStorage.getItem(KEY); } catch (e) { return mem === null ? auto() : mem; }
    return v === '1' ? true : v === '0' ? false : auto();   /* sem escolha salva: celular liga sozinho, PC não */
  }
  function gravar(on) { mem = on; try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {} }
  function ativo()  { return root.classList.contains('modo-celular'); }

  var PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>';
  var DESK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>';

  function pintarBotao(on) {
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? 'Voltar para a versão desktop' : 'Usar a versão de celular');
    btn.innerHTML = (on ? DESK : PHONE) + '<span>' + (on ? 'Desktop' : 'Celular') + '</span>';
  }

  function posicionar() {                  /* mantém o botão no canto da parte VISÍVEL, mesmo com a página mais larga que a tela */
    var vv = window.visualViewport; if (!btn || !vv) return;
    var dx = Math.min(0, vv.offsetLeft + vv.width - window.innerWidth), dy = Math.min(0, vv.offsetTop + vv.height - window.innerHeight);
    btn.style.transform = (dx || dy) ? 'translate(' + dx + 'px,' + dy + 'px)' : '';
  }

  function aplicar(on, avisar) {
    var mudou = ativo() !== on;
    root.classList.toggle('modo-celular', on);
    pintarBotao(on);
    setTimeout(posicionar, 60); setTimeout(posicionar, 400);
    if (avisar && mudou) { try { window.dispatchEvent(new CustomEvent('mesa:modo-celular', { detail: { ativo: on } })); } catch (e) {} }
  }

  function definir(on) { on = !!on; gravar(on); aplicar(on, true); }

  window.MesaModoCelular = {
    ativo: ativo,
    definir: definir,
    alternar: function () { definir(!ativo()); }
  };

  /* aplica já (antes da primeira pintura, sem "piscar") */
  aplicar(ler(), false);

  /* outra aba/página mudou a opção */
  window.addEventListener('storage', function (e) { if (e.key === KEY) aplicar(ler(), true); });
  /* voltou pelo botão "voltar" (cache de página): relê a opção salva */
  window.addEventListener('pageshow', function (e) { if (e.persisted) aplicar(ler(), true); });

  function iniciar() {
    if (semBotao || document.getElementById('mesa-toggle')) return;
    btn = document.createElement('button');
    btn.id = 'mesa-toggle';
    btn.type = 'button';
    document.body.appendChild(btn);        /* fora do #root: o React não apaga */

  }

})();
